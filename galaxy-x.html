<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy X | NEXUS AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #02020a;
    color: white;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: radial-gradient(circle at center, #101638, #02020a 75%);
}

#hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,.55);
    border-bottom: 1px solid #7c3cff;
    z-index: 5;
}

.stat {
    font-size: 17px;
}

.stat span {
    color: #00eaff;
    font-weight: bold;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #777;
    font-size: 13px;
    text-align: center;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.85);
    z-index: 10;
}

.box {
    width: min(90%, 450px);
    padding: 45px;
    text-align: center;
    border: 1px solid #00eaff;
    border-radius: 20px;
    background: rgba(8,10,30,.96);
    box-shadow: 0 0 50px #00eaff55;
}

.box h1 {
    color: #00eaff;
    font-size: 45px;
    margin-bottom: 15px;
}

.box p {
    color: #aaa;
    font-size: 20px;
    margin-bottom: 25px;
}

button {
    padding: 14px 30px;
    border: 0;
    border-radius: 8px;
    color: white;
    background: linear-gradient(90deg,#7c3cff,#00eaff);
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 25px #00eaff88;
}
</style>
</head>

<body>

<div id="hud">
    <div class="stat">🚀 GALAXY X</div>
    <div class="stat">SCORE: <span id="score">0</span></div>
    <div class="stat">❤️ HP: <span id="health">100</span></div>
</div>

<canvas id="game"></canvas>

<div id="help">
    Move: WASD / Arrow Keys &nbsp; | &nbsp; Shoot: SPACE
</div>

<div id="gameOver">
    <div class="box">
        <h1>MISSION FAILED</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

let score = 0;
let health = 100;
let gameRunning = true;

let bullets = [];
let enemies = [];
let asteroids = [];
let stars = [];

let spawnTimer = 0;
let asteroidTimer = 0;
let shootCooldown = 0;

const keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
        keys.space = true;
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
        keys.space = false;
    }
});


/* STARS */

function createStars() {

    stars = [];

    for (let i = 0; i < 120; i++) {

        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + .5,
            speed: Math.random() * 2 + .5
        });
    }
}

createStars();


/* PLAYER */

const player = {
    x: W / 2,
    y: H - 100,
    size: 25,
    speed: 6
};


function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00eaff";

    /* spaceship */

    ctx.fillStyle = "#00eaff";

    ctx.beginPath();

    ctx.moveTo(0, -30);
    ctx.lineTo(-25, 25);
    ctx.lineTo(0, 15);
    ctx.lineTo(25, 25);

    ctx.closePath();

    ctx.fill();

    /* cockpit */

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();
    ctx.arc(0, -5, 7, 0, Math.PI * 2);
    ctx.fill();

    /* engine */

    ctx.fillStyle = "#ff6b00";

    ctx.beginPath();
    ctx.moveTo(-8, 20);
    ctx.lineTo(0, 40);
    ctx.lineTo(8, 20);
    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* SHOOT */

function shoot() {

    if (shootCooldown > 0) return;

    bullets.push({
        x: player.x,
        y: player.y - 30,
        speed: 11,
        size: 4
    });

    shootCooldown = 10;
}


/* BULLET */

function drawBullet(bullet) {

    ctx.save();

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00eaff";

    ctx.fillStyle = "#00eaff";

    ctx.fillRect(
        bullet.x - 2,
        bullet.y - 10,
        4,
        18
    );

    ctx.restore();
}


/* ENEMY SHIPS */

function createEnemy() {

    enemies.push({

        x: Math.random() * (W - 80) + 40,

        y: -50,

        size: 22,

        speed: 1.5 + Math.random() * 2,

        hp: 1
    });
}


function drawEnemy(enemy) {

    ctx.save();

    ctx.translate(enemy.x, enemy.y);

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff2bd6";

    ctx.fillStyle = "#ff2bd6";

    ctx.beginPath();

    ctx.moveTo(0, 25);
    ctx.lineTo(-28, -15);
    ctx.lineTo(0, -5);
    ctx.lineTo(28, -15);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(0, -2, 6, 0, Math.PI * 2);

    ctx.fill();

    ctx.restore();
}


/* ASTEROIDS */

function createAsteroid() {

    asteroids.push({

        x: Math.random() * W,

        y: -60,

        size: 15 + Math.random() * 25,

        speed: 1 + Math.random() * 2,

        rotation: Math.random() * 6
    });
}


function drawAsteroid(a) {

    ctx.save();

    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);

    ctx.shadowBlur = 10;
    ctx.shadowColor = "#884cff";

    ctx.fillStyle = "#665c82";

    ctx.beginPath();

    for (let i = 0; i < 8; i++) {

        const angle = (Math.PI * 2 / 8) * i;

        const radius =
            a.size * (.7 + Math.random() * .3);

        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        if (i === 0)
            ctx.moveTo(x, y);
        else
            ctx.lineTo(x, y);
    }

    ctx.closePath();
    ctx.fill();

    ctx.restore();
}


/* PLAYER MOVEMENT */

function updatePlayer() {

    if (keys["a"] || keys["arrowleft"])
        player.x -= player.speed;

    if (keys["d"] || keys["arrowright"])
        player.x += player.speed;

    if (keys["w"] || keys["arrowup"])
        player.y -= player.speed;

    if (keys["s"] || keys["arrowdown"])
        player.y += player.speed;

    player.x =
        Math.max(30, Math.min(W - 30, player.x));

    player.y =
        Math.max(90, Math.min(H - 40, player.y));

    if (keys.space)
        shoot();
}


/* BULLETS */

function updateBullets() {

    bullets.forEach(b => {
        b.y -= b.speed;
    });

    bullets =
        bullets.filter(b => b.y > -30);
}


/* ENEMIES */

function updateEnemies() {

    enemies.forEach(enemy => {

        enemy.y += enemy.speed;

        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < enemy.size + player.size) {

            health -= 25;

            enemy.y = H + 100;

            updateHUD();

            if (health <= 0)
                endGame();
        }

        if (enemy.y > H + 60) {

            health -= 10;

            enemy.y = H + 100;

            updateHUD();

            if (health <= 0)
                endGame();
        }
    });

    enemies =
        enemies.filter(e => e.y < H + 150);
}


/* ASTEROIDS */

function updateAsteroids() {

    asteroids.forEach(a => {

        a.y += a.speed;

        a.rotation += .01;

        const dx = a.x - player.x;
        const dy = a.y - player.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < a.size + player.size) {

            health -= 15;

            a.y = H + 100;

            updateHUD();

            if (health <= 0)
                endGame();
        }
    });

    asteroids =
        asteroids.filter(a => a.y < H + 100);
}


/* COLLISIONS */

function collisionDetection() {

    bullets.forEach((bullet, bi) => {

        enemies.forEach((enemy, ei) => {

            const dx = bullet.x - enemy.x;
            const dy = bullet.y - enemy.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance <
                enemy.size + bullet.size) {

                bullets.splice(bi, 1);

                enemies.splice(ei, 1);

                score += 20;

                updateHUD();
            }
        });


        asteroids.forEach((a, ai) => {

            const dx = bullet.x - a.x;
            const dy = bullet.y - a.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance <
                a.size + bullet.size) {

                bullets.splice(bi, 1);

                asteroids.splice(ai, 1);

                score += 10;

                updateHUD();
            }
        });

    });
}


/* SPAWN */

function spawnObjects() {

    spawnTimer++;

    asteroidTimer++;

    const difficulty =
        Math.max(20, 70 - Math.floor(score / 100));

    if (spawnTimer >= difficulty) {

        createEnemy();

        spawnTimer = 0;
    }

    if (asteroidTimer >= 45) {

        createAsteroid();

        asteroidTimer = 0;
    }
}


/* STARS */

function updateStars() {

    stars.forEach(star => {

        star.y += star.speed;

        if (star.y > H) {

            star.y = 0;
            star.x = Math.random() * W;
        }
    });
}


function drawStars() {

    stars.forEach(star => {

        ctx.fillStyle = "#ffffff";

        ctx.globalAlpha = .4 + star.size / 3;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    ctx.globalAlpha = 1;
}


/* HUD */

function updateHUD() {

    document.getElementById("score").textContent = score;

    document.getElementById("health").textContent =
        Math.max(0, health);
}


/* GAME OVER */

function endGame() {

    gameRunning = false;

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("gameOver")
        .style.display = "flex";
}


/* RESTART */

function restartGame() {

    score = 0;

    health = 100;

    bullets = [];
    enemies = [];
    asteroids = [];

    player.x = W / 2;
    player.y = H - 100;

    spawnTimer = 0;
    asteroidTimer = 0;
    shootCooldown = 0;

    gameRunning = true;

    updateHUD();

    document.getElementById("gameOver")
        .style.display = "none";

    gameLoop();
}


/* GAME LOOP */

function gameLoop() {

    if (!gameRunning)
        return;

    ctx.clearRect(0, 0, W, H);

    updateStars();
    drawStars();

    updatePlayer();
    updateBullets();
    updateEnemies();
    updateAsteroids();

    collisionDetection();

    spawnObjects();

    if (shootCooldown > 0)
        shootCooldown--;

    bullets.forEach(drawBullet);
    enemies.forEach(drawEnemy);
    asteroids.forEach(drawAsteroid);

    drawPlayer();

    requestAnimationFrame(gameLoop);
}


window.addEventListener("resize", () => {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    player.x = W / 2;
    player.y = H - 100;

    createStars();
});


updateHUD();
gameLoop();

</script>

</body>
</html>
